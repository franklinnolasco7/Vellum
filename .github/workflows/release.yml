name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get previous tag
        id: prev_tag
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        run: git pull origin main --tags

      - name: Get new tag
        id: new_tag
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Install System Dependencies
        if: steps.prev_tag.outputs.tag != steps.new_tag.outputs.tag
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        if: steps.prev_tag.outputs.tag != steps.new_tag.outputs.tag
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Tauri Build & Upload
        if: steps.prev_tag.outputs.tag != steps.new_tag.outputs.tag
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.new_tag.outputs.tag }}
          args: --bundles deb,rpm

      - name: Create and Upload tar.gz
        if: steps.prev_tag.outputs.tag != steps.new_tag.outputs.tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri/target/release/
          tar -czf Vivant-${{ steps.new_tag.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz Vivant
          gh release upload ${{ steps.new_tag.outputs.tag }} Vivant-${{ steps.new_tag.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz
